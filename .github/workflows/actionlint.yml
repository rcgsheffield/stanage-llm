name: actionlint

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/**'
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    env:
      ACTIONLINT_VERSION: 1.7.12
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Download actionlint
        run: bash <(curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
      - name: Run actionlint
        run: ./actionlint -color
