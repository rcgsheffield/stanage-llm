name: CITATION.cff

permissions:
  contents: read

on:
  push:
    branches: [ main ]
    paths:
      - 'CITATION.cff'
      - '.github/workflows/cff.yml'
  pull_request:
    paths:
      - 'CITATION.cff'
      - '.github/workflows/cff.yml'

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Validate CITATION.cff
        uses: citation-file-format/cffconvert-github-action@2.0.0
        with:
          args: --validate
